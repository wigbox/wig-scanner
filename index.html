<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="סורק פאות">
<title>סורק פאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F4F0; --surface: #FFFFFF; --border: rgba(0,0,0,0.10);
    --text-primary: #1A1A18; --text-secondary: #6B6B65; --text-hint: #A8A8A0;
    --green-bg: #EAF3DE; --green-text: #27500A; --green-border: #97C459;
    --blue-bg: #E6F1FB; --blue-text: #0C447C; --blue-border: #85B7EB;
    --amber-bg: #FAEEDA; --amber-text: #633806; --amber-border: #EF9F27;
    --red-bg: #FDECEA; --red-text: #7A1F1F; --red-border: #E57373;
    --purple-bg: #F3EEFB; --purple-text: #4A1D7A; --purple-border: #B39DDB;
    --grey-bg: #F0F0EE; --grey-text: #444442; --grey-border: #AAAAAA;
    --radius: 16px; --radius-sm: 10px;
  }
  html, body { height: 100%; background: var(--bg); font-family: 'Heebo', sans-serif; color: var(--text-primary); -webkit-font-smoothing: antialiased; }
  .page { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 3rem; }
  .header { text-align: center; margin-bottom: 2rem; }
  .header h1 { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
  .header p { font-size: 13px; color: var(--text-hint); }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 440px; margin-bottom: 1rem; }
  .field-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 0.04em; }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; font-family: 'Heebo', sans-serif; font-size: 20px; font-weight: 500;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text-primary); -webkit-appearance: none; appearance: none; outline: none;
  }
  .input-row input:focus { border-color: rgba(0,0,0,0.35); }
  .input-row input::placeholder { color: var(--text-hint); font-size: 15px; font-weight: 400; }
  .btn { padding: 12px 16px; background: var(--text-primary); color: #fff; border: none; border-radius: var(--radius-sm); font-family: 'Heebo', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .btn:active { opacity: 0.8; }
  .btn-scan { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 10px; padding: 12px 16px; background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'Heebo', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn-scan:active { opacity: 0.7; }
  .hint { font-size: 12px; color: var(--text-hint); text-align: center; margin-top: 8px; }

  .result-card { width: 100%; max-width: 440px; border-radius: var(--radius); padding: 1.5rem; border: 1px solid; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .c-none     { background: var(--green-bg);  border-color: var(--green-border); }
  .c-action   { background: var(--amber-bg);  border-color: var(--amber-border); }
  .c-sold     { background: var(--red-bg);    border-color: var(--red-border); }
  .c-order    { background: var(--purple-bg); border-color: var(--purple-border); }
  .c-wash     { background: var(--grey-bg);   border-color: var(--grey-border); }
  .c-storage  { background: var(--blue-bg);   border-color: var(--blue-border); }
  .c-error    { background: #fff0f0; border-color: #f09595; }
  .c-success  { background: var(--green-bg);  border-color: var(--green-border); }

  .status-badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .c-none    .status-badge { background: var(--green-border);  color: var(--green-text); }
  .c-action  .status-badge { background: var(--amber-border);  color: var(--amber-text); }
  .c-sold    .status-badge { background: var(--red-border);    color: var(--red-text); }
  .c-order   .status-badge { background: var(--purple-border); color: var(--purple-text); }
  .c-wash    .status-badge { background: var(--grey-border);   color: var(--grey-text); }
  .c-storage .status-badge { background: var(--blue-border);   color: var(--blue-text); }
  .c-error   .status-badge { background: #f09595; color: #501313; }
  .c-success .status-badge { background: var(--green-border);  color: var(--green-text); }

  .result-action { font-size: 24px; font-weight: 700; line-height: 1.2; margin-bottom: 14px; }
  .c-none    .result-action { color: var(--green-text); }
  .c-action  .result-action { color: var(--amber-text); }
  .c-sold    .result-action { color: var(--red-text); }
  .c-order   .result-action { color: var(--purple-text); }
  .c-wash    .result-action { color: var(--grey-text); }
  .c-storage .result-action { color: var(--blue-text); }
  .c-error   .result-action { color: #A32D2D; }
  .c-success .result-action { color: var(--green-text); }

  .detail-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 7px 0; }
  .detail-row + .detail-row { border-top: 0.5px solid rgba(0,0,0,0.08); }
  .dk { font-size: 13px; color: rgba(0,0,0,0.45); white-space: nowrap; }
  .dv { font-size: 13px; font-weight: 500; color: var(--text-primary); text-align: left; word-break: break-word; }
  .err-detail { font-size: 12px; color: rgba(0,0,0,0.6); background: rgba(0,0,0,0.04); border-radius: 8px; padding: 8px 10px; margin-top: 10px; text-align: right; line-height: 1.5; }
  .err-detail a { color: #0C447C; text-decoration: underline; }

  .btn-confirm { width: 100%; margin-top: 14px; padding: 14px; font-size: 16px; border-radius: var(--radius-sm); border: none; font-family: 'Heebo', sans-serif; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; background: #854F0B; color: #fff; }
  .btn-confirm.display { background: #185FA5; }
  .btn-confirm:active { opacity: 0.8; }
  .btn-confirm:disabled { opacity: 0.5; }
  .btn-skip { width: 100%; margin-top: 8px; padding: 10px; font-size: 14px; border-radius: var(--radius-sm); border: 0.5px solid rgba(0,0,0,0.15); background: transparent; font-family: 'Heebo', sans-serif; font-weight: 500; color: var(--text-secondary); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn-stay { width: 100%; margin-top: 14px; padding: 14px; font-size: 16px; border-radius: var(--radius-sm); border: none; font-family: 'Heebo', sans-serif; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; background: var(--text-primary); color: #fff; }
  .btn-stay:active { opacity: 0.8; }
  .btn-move-subtle { width: 100%; margin-top: 8px; padding: 10px; font-size: 14px; border-radius: var(--radius-sm); border: 0.5px solid rgba(0,0,0,0.15); background: transparent; font-family: 'Heebo', sans-serif; font-weight: 500; color: var(--text-secondary); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn-move-subtle:disabled { opacity: 0.5; }

  .drawer-pick { margin-top: 10px; padding: 12px; background: rgba(255,255,255,0.6); border-radius: var(--radius-sm); }
  .drawer-error { min-height: 18px; margin: 6px 0; font-size: 12px; color: #A32D2D; }
  .drawer-pick input { width: 100%; font-family: 'Heebo', sans-serif; font-size: 22px; font-weight: 500; text-transform: uppercase; text-align: center; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-primary); }
  .drawer-pick select { width: 100%; font-family: 'Heebo', sans-serif; font-size: 18px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-primary); }
  .loading-card { width: 100%; max-width: 440px; padding: 2rem; text-align: center; color: var(--text-secondary); font-size: 14px; }
  .spinner { width: 24px; height: 24px; border: 2px solid rgba(0,0,0,0.12); border-top-color: var(--text-primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer { margin-top: auto; padding-top: 2rem; font-size: 11px; color: var(--text-hint); text-align: center; }

  /* Scanner overlay */
  .scan-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; }
  .scan-overlay.hidden { display: none; }
  .scan-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; color: #fff; }
  .scan-header span { font-size: 15px; font-weight: 500; }
  .scan-close { background: rgba(255,255,255,0.15); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  #qr-reader { flex: 1; width: 100%; }
  #qr-reader video { object-fit: cover; }
  .scan-hint { color: rgba(255,255,255,0.7); text-align: center; font-size: 13px; padding: 12px 16px 20px; }
  .scan-error { color: #ffb3b3; text-align: center; font-size: 13px; padding: 0 16px 16px; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>סורק פאות</h1>
    <p>בדיקת סטטוס ומיקום</p>
  </div>

  <div class="card">
    <label class="field-label">מזהה פאה</label>
    <div class="input-row">
      <input type="number" id="wigInput" placeholder="הקלידי מספר פאה..." inputmode="numeric" autocomplete="off" />
      <button class="btn" onclick="lookup()">בדיקה</button>
    </div>
    <button class="btn-scan" onclick="openScanner()">📷 סריקת ברקוד</button>
    <p class="hint">הקלידי מספר פאה ידנית או סרקי ברקוד</p>
  </div>

  <div id="result"></div>
  <div class="footer">wigbox · Extra Inventory Management</div>
</div>

<div class="scan-overlay hidden" id="scanOverlay">
  <div class="scan-header">
    <span>סריקת ברקוד</span>
    <button class="scan-close" onclick="closeScanner()">✕</button>
  </div>
  <div id="qr-reader"></div>
  <div class="scan-error" id="scanError"></div>
  <div class="scan-hint">כווני את המצלמה לברקוד של הפאה</div>
</div>

<script>
// Google Sheet "Storage Management"
const SHEET_ID      = '1cexgD9BIzu-zX51FFQCuyJ-IlY0O7DlKSVjD3gXXSYw';
const INVENTORY_GID = '210643961';   // tab "Full Inventory"  — A: S/N, B: Status, C: Location (DISPLAY / STORAGE / Not In Store)
const WASH_GID      = '2057793530';  // tab "סטטוס פאות"      — A: S/N, B: Location (מגירה / חפיפה)
const TO_DRAWER_GID = '0';           // tab "למגירה"         — A: S/N, B: action, C: drawer to move to, D: wig code, E: drawer group
const TO_DISPLAY_GID = '1';          // tab "לתצוגה"         — A: S/N, B: action, C: drawer it is in now, D: wig code, E: drawer group
const BIN_GID       = '759975009';   // tab "Bin List"       — A: drawer (bin) the wig should be in, B: S/N
const WEBHOOK       = 'https://hook.integrator.boost.space/99xaelrc8ix1v3iu6tg6uw53ndwm7267';

const SHEETS = [
  { name: 'Full Inventory', gid: INVENTORY_GID },
  { name: 'סטטוס פאות',     gid: WASH_GID },
  { name: 'לתצוגה',         gid: TO_DISPLAY_GID },
  { name: 'למגירה',         gid: TO_DRAWER_GID },
  { name: 'Bin List',       gid: BIN_GID }
];

// A drawer code is a letter A–O followed by a number 1–7 (for example A3).
// The "which drawer" box accepts upper or lower case; anything else is rejected.
function normalizeDrawer(text) {
  return (text || '').trim().toUpperCase().replace(/[\s-]/g, '');
}
function isValidDrawer(text) {
  return /^[A-O][1-7]$/.test(normalizeDrawer(text));
}

const wigInput  = document.getElementById('wigInput');
const resultDiv = document.getElementById('result');

wigInput.addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
wigInput.addEventListener('input',   () => { if (resultDiv.innerHTML) resultDiv.innerHTML = ''; });

// Auto-lookup from URL param
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (id) {
    wigInput.value = id.replace(/\D/g, '');
    lookup();
  }
});

function csvUrl(gid) {
  // gviz/tq is Google's public query endpoint for Sheets — unlike /export?format=csv
  // (built for the Sheets UI's own download button), this one is served with CORS
  // headers that allow cross-origin fetch() from another website.
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}&t=${Date.now()}`;
}

// Fetches one sheet and reports back either { rows } or { error } — never throws,
// so one broken tab/permission doesn't take down the whole lookup silently.
async function fetchCSV(name, gid) {
  const url = csvUrl(gid);
  try {
    const res = await fetch(url);
    if (!res.ok) {
      return { name, gid, error: `HTTP ${res.status}`, url };
    }
    const text = await res.text();
    const trimmed = text.trim();
    if (trimmed.startsWith('<!DOCTYPE') || trimmed.startsWith('<html') || /accounts\.google\.com/i.test(trimmed.slice(0, 500))) {
      return { name, gid, error: 'התקבל דף התחברות של גוגל במקום CSV — הגיליון כנראה לא משותף כ"כל מי שיש לו את הקישור"', url };
    }
    return { name, gid, rows: parseCSVAll(text) };
  } catch (e) {
    return { name, gid, error: e.message || 'הבקשה נכשלה (ייתכן חסימת רשת/CORS)', url };
  }
}

function parseCSVAll(text) {
  const rows = [];
  const lines = text.trim().split('\n');
  for (const line of lines) {
    rows.push(parseCSVRow(line));
  }
  return rows;
}

function parseCSVRow(row) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < row.length; i++) {
    const c = row[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
    else { cur += c; }
  }
  result.push(cur.trim());
  return result;
}

function getMasterStatus(masterStatus) {
  // Compared in lower case: the sheet has both "Fix-Return" and "Fix-return"
  const s = (masterStatus || '').trim().toLowerCase();
  const soldStatuses    = ['sold', 'personal use', 'barter'];
  const returnStatuses  = ['returned', 'missing', 'damaged'];
  const inStockStatuses = ['in stock', 'consignment'];

  if (inStockStatuses.includes(s)) return { type: 'instock', label: '' };
  if (soldStatuses.includes(s))    return { type: 'sold',    label: 'נמכרה / יצאה מהמלאי' };
  if (returnStatuses.includes(s))  return { type: 'sold',    label: 'הוחזרה לספק / חסרה' };
  if (s === 'inventory reserved')  return { type: 'order',   label: 'הזמנת לקוחה - בחנות' };
  if (s === 'ordered')             return { type: 'order',   label: 'הוזמנה - בדרך' };
  if (s === 'order reserved')      return { type: 'order',   label: 'הזמנת לקוחה - בדרך' };
  if (s === 'wish list' || s === 'fix-return') return { type: 'order', label: 'בהזמנה' };
  // Anything else ("Other", "Cancelled", "Never Made", empty, a new status nobody mapped yet)
  // is NOT in stock — it is treated as left inventory.
  return { type: 'sold', label: 'יצאה מהמלאי' };
}

async function lookup() {
  clearTimeout(resetTimer);   // don't let the previous "sent" card wipe this lookup
  const id = wigInput.value.trim();
  if (!id) { wigInput.focus(); return; }
  window.history.replaceState({}, document.title, window.location.pathname);

  resultDiv.innerHTML = `<div class="loading-card"><div class="spinner"></div>טוענת נתונים...</div>`;

  const [inventoryRes, washRes, toDisplayRes, toDrawerRes, binRes] = await Promise.all(
    SHEETS.map(s => fetchCSV(s.name, s.gid))
  );

  const failed = [inventoryRes, washRes, toDisplayRes, toDrawerRes, binRes].filter(r => r.error);
  if (failed.length) {
    showLoadError(failed);
    return;
  }

  const inventoryRows  = inventoryRes.rows;
  const washRows       = washRes.rows;
  const toDisplayRows  = toDisplayRes.rows;
  const toDrawerRows   = toDrawerRes.rows;
  const binRows        = binRes.rows;

  try {
    // 1. Full Inventory (col A = S/N, col B = status, col C = location)
    const masterMatch = inventoryRows.slice(1).find(r => r[0] && r[0].trim() === id);
    if (!masterMatch) {
      resultDiv.innerHTML = `
        <div class="result-card c-error">
          <span class="status-badge">לא נמצאה</span>
          <div class="result-action">פאה לא נמצאת במערכת</div>
          <div class="detail-row"><span class="dk">מזהה פאה</span><span class="dv">${id}</span></div>
          <button class="btn-skip" onclick="reset()" style="margin-top:14px;">← סריקה הבאה</button>
        </div>`;
      return;
    }
    const masterStatus = masterMatch[1];
    const { type: masterType, label: masterLabel } = getMasterStatus(masterStatus);

    // 2. סטטוס פאות (col A = S/N, col B = מגירה / חפיפה, col C = drawer it was actually placed in)
    const washMatch = washRows.slice(1).find(r => r[0] && r[0].trim() === id);
    const inWash = !!washMatch && (washMatch[1] || '').trim() === 'חפיפה';

    // Bin List (col A = drawer, col B = S/N): the drawer this wig SHOULD be in
    const binMatch = binRows.slice(1).find(r => r[1] && r[1].trim() === id);
    const shouldBeIn = binMatch ? (binMatch[0] || '').trim() : '';

    // The drawer it was actually placed in (written by Boost into col C of סטטוס פאות; only known for
    // wigs placed with this app). Shown only on "in storage" cards, next to where it should be.
    let drawerRows = [];
    let placedDrawer = '';   // where Boost recorded it (col C of סטטוס פאות), if anywhere
    if (shouldBeIn) drawerRows.push(['אמורה להיות במגירה', shouldBeIn]);
    if (washMatch && (washMatch[1] || '').trim() === 'מגירה') {
      const placedD = (washMatch[2] || '').trim();
      placedDrawer = placedD;
      if (placedD) {
        const differs = shouldBeIn && placedD !== shouldBeIn;
        drawerRows.push(['נמצאת במגירה', differs ? `${placedD} ⚠ לא במגירה המתוכננת` : placedD]);
      }
    }

    if (masterType !== 'instock') {
      // Not in stock — if it is also marked חפיפה, offer to clear the wash status
      showResult(id, masterType, masterLabel, '', '', null, null, inWash);
      return;
    }

    // 3. Current location: wash wins, otherwise Full Inventory (col C: STORAGE / DISPLAY)
    const inventoryLoc = (masterMatch[2] || '').trim().toUpperCase();
    let currentLocation = 'בתצוגה'; // default
    let locType = 'none';

    if (inWash) { currentLocation = 'בחפיפה'; locType = 'wash'; }
    else if (inventoryLoc === 'STORAGE') { currentLocation = 'באחסון'; locType = 'storage'; }

    // 4. The two action lists: "לתצוגה" = move to display, "למגירה" = move to a drawer
    // (col A = S/N, col B = action, col C = drawer, col D = wig code, col E = drawer group)
    const displayMatch = toDisplayRows.slice(1).find(r => r[0] && r[0].trim() === id);
    const drawerMatch  = toDrawerRows.slice(1).find(r => r[0] && r[0].trim() === id);

    // The two lists are formulas that lag behind: a wig that was just moved can stay listed for a few minutes.
    // If סטטוס פאות already says where it is, trust that and say the list is behind, instead of asking for the same move again.
    const listLagDisplay = !!displayMatch && locType === 'none';    // already on display
    const listLagDrawer  = !!drawerMatch && locType === 'storage';  // already in a drawer
    if (listLagDisplay) drawerRows.unshift(['שימי לב', 'הפאה כבר בתצוגה — הרשימה "להעביר לתצוגה" עדיין לא התעדכנה']);
    if (listLagDrawer)  drawerRows.unshift(['שימי לב', 'הפאה כבר במגירה — הרשימה "להעביר למגירה" עדיין לא התעדכנה']);

    if (displayMatch && !listLagDisplay) {
      const desc = (displayMatch[3] || '').trim();
      // Which drawer is it in now? The list says; otherwise where Boost recorded it; otherwise where it should be.
      const listDrawer = (displayMatch[2] || '').trim();
      const nowDrawer = [listDrawer, placedDrawer, shouldBeIn].map(normalizeDrawer).find(isValidDrawer) || '';
      showResult(id, 'action', 'העברה לתצוגה', currentLocation, desc, 'פאה בתצוגה', nowDrawer, false, currentLocation, 'נמצאת עכשיו במגירה', '',
        nowDrawer ? null : [['נמצאת עכשיו במגירה', 'לא ידועה']], 'להעביר לתצוגה');
    } else if (drawerMatch && !listLagDrawer) {
      const desc = (drawerMatch[3] || '').trim();
      const loc  = (drawerMatch[2] || '').trim() || shouldBeIn;
      // The Boost scenario routes on the exact words of `action` + `current_location`:
      //   on display -> 'להעביר לאחסון' (route "add row"), in wash -> 'העברה לאחסון' (route "update row").
      // Do not reword these without changing the filters in Boost.
      const driverAction = currentLocation === 'בחפיפה' ? 'העברה לאחסון' : 'להעביר לאחסון';
      // The card title says where to put it ("להעביר למגירה A1") so it can't be read as "it is in A1".
      // `driverAction` is what is sent to Boost and must stay exactly as it is.
      showResult(id, 'action', driverAction, currentLocation, desc, 'פאה במגירה', loc, false, currentLocation, 'מגירה מתוכננת', loc, null, loc ? `להעביר למגירה ${loc}` : 'להעביר למגירה');
    } else {
      // No action needed — show current location
      const noActionText = locType === 'wash' ? 'בחפיפה' : 'אין שינוי נדרש';
      showResult(id, locType === 'wash' ? 'wash' : locType === 'storage' ? 'storage' : 'none', noActionText, currentLocation, '', null, null, false, '', '', shouldBeIn, drawerRows);
    }

  } catch(e) {
    resultDiv.innerHTML = `
      <div class="result-card c-error">
        <span class="status-badge">שגיאה</span>
        <div class="result-action">שגיאה בעיבוד הנתונים</div>
        <div class="err-detail">${(e.message || e).toString()}</div>
      </div>`;
  }
}

function showLoadError(failed) {
  const items = failed.map(f => `
    <div class="err-detail">
      <strong>${f.name}</strong>: ${f.error}<br>
      <a href="${f.url}" target="_blank" rel="noopener">בדיקת הקישור ישירות ←</a>
    </div>`).join('');
  resultDiv.innerHTML = `
    <div class="result-card c-error">
      <span class="status-badge">שגיאה</span>
      <div class="result-action">לא ניתן לטעון נתונים</div>
      <div class="detail-row"><span class="dk">בדקי הרשאות שיתוף בגיליון (Anyone with the link)</span><span class="dv"></span></div>
      ${items}
      <button class="btn-skip" onclick="lookup()" style="margin-top:14px;">↻ נסי שוב</button>
    </div>`;
}

// plannedDrawer: only for "move to a drawer" cards — the drawer the list asked for.
// drawerRows: only for "no change" cards — [label, value] pairs: the drawer it should be in, and where it was placed.
// displayTitle: the heading shown on the card. `mainText` is also what is sent to Boost as `action`, so it cannot be reworded.
function showResult(id, type, mainText, currentLocation, desc, zohoVal, helperLoc, soldAndWash, webhookCurrentLoc, locLabel, plannedDrawer, drawerRows, displayTitle) {
  locLabel = locLabel || 'מגירה';
  webhookCurrentLoc = webhookCurrentLoc || currentLocation || '';
  const cls = `c-${type}`;
  const badges = {
    none: 'תקין · אין שינוי',
    action: 'נדרשת פעולה',
    sold: 'יצאה מהמלאי',
    order: 'בהזמנה',
    wash: 'בחפיפה',
    storage: 'באחסון · אין שינוי'
  };
  const badge = badges[type] || '';
  const isDisplay = zohoVal === 'פאה בתצוגה';
  const confirmCls = isDisplay ? 'display' : '';

  let html = `
    <div class="result-card ${cls}">
      <span class="status-badge">${badge}</span>
      <div class="result-action">${displayTitle || mainText}</div>`;

  if (currentLocation) {
    html += `<div class="detail-row"><span class="dk">מיקום נוכחי</span><span class="dv">${currentLocation}</span></div>`;
  }
  if (desc) {
    html += `<div class="detail-row"><span class="dk">מאפיינים</span><span class="dv">${desc}</span></div>`;
  }
  if (helperLoc) {
    html += `<div class="detail-row"><span class="dk">${locLabel}</span><span class="dv">${helperLoc}</span></div>`;
  }
  (drawerRows || []).forEach(([label, value]) => {
    html += `<div class="detail-row"><span class="dk">${label}</span><span class="dv">${value}</span></div>`;
  });
  html += `<div class="detail-row"><span class="dk">מזהה פאה</span><span class="dv">${id}</span></div>`;

  if (soldAndWash) {
    // Override badge to show both statuses
    html = html.replace(`<span class="status-badge">${badge}</span>`, `<span class="status-badge">${badge} · בחפיפה</span>`);
    html += `<div class="detail-row"><span class="dk">מיקום נוכחי</span><span class="dv">בחפיפה</span></div>`;
    html += `
      <button class="btn-confirm display" id="confirmBtn" onclick="confirmAction('${id}','פאה בתצוגה','מחיקת סטטוס חפיפה','${encodeURIComponent(desc)}','','${webhookCurrentLoc}')">מחקי סטטוס חפיפה</button>
      <button class="btn-skip" onclick="reset()">השאירי כמו שזה</button>`;
  } else if (type === 'wash') {
    html += `
      <button class="btn-confirm display" id="confirmBtn" onclick="confirmAction('${id}','פאה בתצוגה','העברה לתצוגה','${encodeURIComponent(desc)}','','${webhookCurrentLoc}')">✓ העברי לתצוגה</button>
      <button class="btn-confirm" id="otherDrawerLink" style="margin-top:8px;" onclick="showOtherDrawer()">✓ העברי לאחסון</button>
      ${drawerPickerHtml(`'${id}','פאה במגירה','העברה לאחסון','${encodeURIComponent(desc)}','','${webhookCurrentLoc}',''`, '')}
      <button class="btn-skip" onclick="reset()">השאירי כמו שזה</button>`;
  } else if (type === 'storage') {
    // In a drawer already: leave it, correct which drawer it is in, or move it to display.
    // Correcting sends action 'עדכון מגירה' — the Boost scenario has a filter for exactly this word (route "update row").
    const fixArgs = `'${id}','פאה במגירה','עדכון מגירה','${encodeURIComponent(desc)}','','${webhookCurrentLoc}','${encodeURIComponent(plannedDrawer || '')}'`;
    html += `
      <button class="btn-stay" onclick="reset()">✓ השאירי כמו שזה</button>
      <button class="btn-move-subtle" id="otherDrawerLink" onclick="showOtherDrawer()">הפאה במגירה אחרת — עדכני מגירה</button>
      ${drawerPickerHtml(fixArgs, '', 'באיזו מגירה הפאה נמצאת עכשיו? (אות A–O ומספר 1–7)', '✓ עדכני את המגירה')}
      <button class="btn-move-subtle" id="confirmBtn" onclick="confirmAction('${id}','פאה בתצוגה','העברה לתצוגה','${encodeURIComponent(desc)}','','${webhookCurrentLoc}')">העברי לתצוגה</button>`;
  } else if (type === 'none') {
    html += `
      <button class="btn-stay" onclick="reset()">✓ השאירי כמו שזה</button>
      <button class="btn-move-subtle" id="otherDrawerLink" onclick="showOtherDrawer()">העברי לאחסון</button>
      ${drawerPickerHtml(`'${id}','פאה במגירה','להעביר לאחסון','${encodeURIComponent(desc)}','','${webhookCurrentLoc}',''`, '')}`;
  } else if (zohoVal && plannedDrawer) {
    // Move to a drawer: one tap if it went where the list said, otherwise pick the drawer it really went to
    const common = `'${id}','${zohoVal}','${mainText}','${encodeURIComponent(desc)}','${encodeURIComponent(helperLoc || '')}','${webhookCurrentLoc}','${encodeURIComponent(plannedDrawer)}'`;
    html += `
      <button class="btn-confirm" id="confirmBtn" onclick="confirmAction(${common},'${encodeURIComponent(plannedDrawer)}')">✓ הנחתי במגירה ${plannedDrawer}</button>
      <button class="btn-move-subtle" id="otherDrawerLink" onclick="showOtherDrawer()">הונחה במגירה אחרת</button>
      ${drawerPickerHtml(common, plannedDrawer)}
      <button class="btn-skip" onclick="reset()">השאירי כמו שזה</button>`;
  } else if (zohoVal) {
    html += `
      <button class="btn-confirm ${confirmCls}" id="confirmBtn" onclick="confirmAction('${id}','${zohoVal}','${mainText}','${encodeURIComponent(desc)}','${encodeURIComponent(helperLoc || '')}','${webhookCurrentLoc}')">✓ אישור — ביצעתי את הפעולה</button>
      <button class="btn-skip" onclick="reset()">השאירי כמו שזה</button>`;
  } else {
    html += `<button class="btn-skip" onclick="reset()" style="margin-top:14px;">← סריקה הבאה</button>`;
  }

  html += `</div>`;
  resultDiv.innerHTML = html;
}

// The hidden "which drawer?" dropdown + confirm button (shown by showOtherDrawer).
// `common` = the first seven arguments of confirmAction, `exclude` = a drawer to leave out of the list.
function drawerPickerHtml(common, exclude, question, buttonText) {
  return `
      <div id="otherDrawerBox" class="drawer-pick" style="display:none;">
        <label class="field-label" for="drawerSelect">${question || 'באיזו מגירה הונחה הפאה? (אות A–O ומספר 1–7)'}</label>
        <input id="drawerSelect" type="text" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false"
               oninput="checkDrawerInput('${exclude || ''}')" />
        <div id="drawerError" class="drawer-error"></div>
        <button class="btn-confirm" id="confirmOtherBtn" disabled onclick="confirmOtherDrawer(${common})">${buttonText || '✓ הנחתי במגירה שהוקלדה'}</button>
      </div>`;
}

function showOtherDrawer() {
  document.getElementById('otherDrawerLink').style.display = 'none';
  document.getElementById('otherDrawerBox').style.display = 'block';
  document.getElementById('drawerSelect').focus();
}

// Enables the confirm button only for a real drawer code (letter A–O + number 1–7)
function checkDrawerInput(planned) {
  const box = document.getElementById('drawerSelect');
  const err = document.getElementById('drawerError');
  const btn = document.getElementById('confirmOtherBtn');
  const value = normalizeDrawer(box.value);
  let message = '';
  if (value.length >= 2 && !isValidDrawer(value)) message = 'מגירה לא קיימת — אות A עד O ומספר 1 עד 7';
  else if (planned && value === planned) message = 'זו המגירה המתוכננת — לחצי על "הנחתי במגירה ' + planned + '"';
  err.textContent = message;
  btn.disabled = !(isValidDrawer(value) && value !== planned);
}

// Same as confirmAction, but the drawer comes from the typed box instead of the list
function confirmOtherDrawer(wigId, zohoValue, action, descEnc, locEnc, currentLoc, plannedEnc) {
  const chosen = normalizeDrawer(document.getElementById('drawerSelect').value);
  if (!isValidDrawer(chosen)) return;
  confirmAction(wigId, zohoValue, action, descEnc, locEnc, currentLoc, plannedEnc, encodeURIComponent(chosen), 'confirmOtherBtn');
}

let resetTimer = null;   // auto-clears the "sent" card; cancelled as soon as a new wig is looked up

// plannedEnc / actualEnc: only for "move to a drawer" — the drawer the list asked for and the drawer it was really put in.
async function confirmAction(wigId, zohoValue, action, descEnc, locEnc, currentLoc, plannedEnc, actualEnc, btnId) {
  const btn  = document.getElementById(btnId || 'confirmBtn');
  const desc = decodeURIComponent(descEnc);
  const loc  = decodeURIComponent(locEnc);
  const plannedDrawer = plannedEnc ? decodeURIComponent(plannedEnc) : '';
  const actualDrawer  = actualEnc ? decodeURIComponent(actualEnc) : '';
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'שולחת...';
  try {
    await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        wig_id: wigId, action, zoho_status: zohoValue, description: desc, location: loc,
        current_location: currentLoc || '',
        planned_drawer: plannedDrawer,
        actual_drawer: actualDrawer,
        drawer_changed: !!(plannedDrawer && actualDrawer && plannedDrawer !== actualDrawer),
        timestamp: new Date().toISOString()
      })
    });
    // Say clearly where the wig went (the drawer, when there is one)
    let where = '';
    if (actualDrawer) where = action === 'עדכון מגירה' ? `המגירה עודכנה: ${actualDrawer}` : `הפאה הועברה למגירה ${actualDrawer}`;
    else if (zohoValue === 'פאה בתצוגה') where = action === 'מחיקת סטטוס חפיפה' ? 'סטטוס החפיפה נמחק' : 'הפאה הועברה לתצוגה';
    else if (zohoValue === 'פאה במגירה') where = 'הפאה הועברה לאחסון';
    const plannedNote = (plannedDrawer && actualDrawer && plannedDrawer !== actualDrawer)
      ? `<div class="detail-row"><span class="dk">מגירה מתוכננת</span><span class="dv">${plannedDrawer}</span></div>` : '';
    resultDiv.innerHTML = `
      <div class="result-card c-success" style="text-align:center;">
        <span class="status-badge">נשלח · נרשם בהצלחה</span>
        <div class="result-action" style="font-size:26px;">✓ ${where || 'הפעולה נרשמה'}</div>
        <div class="detail-row"><span class="dk">מזהה פאה</span><span class="dv">${wigId}</span></div>
        ${plannedNote}
        <button class="btn-skip" onclick="reset()" style="margin-top:14px;">← סריקה הבאה</button>
      </div>`;
    clearTimeout(resetTimer);
    resetTimer = setTimeout(reset, 7000);
  } catch(e) {
    btn.disabled = false;
    btn.textContent = originalLabel;
    alert('שגיאה בשליחה — בדקי חיבור ונסי שוב');
  }
}

function reset() {
  resultDiv.innerHTML = '';
  wigInput.value = '';
  wigInput.focus();
  window.history.replaceState({}, document.title, window.location.pathname);
}

// ---- Barcode scanning ----
let html5QrCode = null;
let scannerRunning = false;

async function openScanner() {
  const overlay = document.getElementById('scanOverlay');
  const errEl = document.getElementById('scanError');
  errEl.textContent = '';
  overlay.classList.remove('hidden');

  if (typeof Html5Qrcode === 'undefined') {
    errEl.textContent = 'ספריית הסריקה לא נטענה — בדקי חיבור לאינטרנט ונסי שוב';
    return;
  }

  try {
    html5QrCode = new Html5Qrcode('qr-reader');
    const config = { fps: 10, qrbox: { width: 260, height: 160 } };
    await html5QrCode.start(
      { facingMode: 'environment' },
      config,
      onScanSuccess,
      () => {} // ignore per-frame "not found" errors
    );
    scannerRunning = true;
  } catch (e) {
    errEl.textContent = 'לא ניתן לגשת למצלמה — ודאי שאישרת הרשאת מצלמה לדפדפן';
  }
}

async function closeScanner() {
  const overlay = document.getElementById('scanOverlay');
  if (html5QrCode && scannerRunning) {
    try { await html5QrCode.stop(); html5QrCode.clear(); } catch(e) {}
    scannerRunning = false;
  }
  overlay.classList.add('hidden');
}

function onScanSuccess(decodedText) {
  const digits = (decodedText || '').replace(/\D/g, '');
  if (!digits) return;
  closeScanner();
  wigInput.value = digits;
  lookup();
}
</script>
